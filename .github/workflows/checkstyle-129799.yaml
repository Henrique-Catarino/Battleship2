name: "Checkstyle - Naming Conventions (129799)"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle (MethodName Rule)
        run: mvn checkstyle:check -Dcheckstyle.config.location=checkstyle-129799.xml -Dcheckstyle.consoleOutput=true -Dcheckstyle.failsOnError=true
