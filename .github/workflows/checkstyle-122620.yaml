# 122620 - Miguel Ferreira
name: Checkstyle gate 122620
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v1.15.0
        with:
          checkstyle_config: checkstyle-122620.xml
          reporter: github-pr-review
          fail_on_error: true
